# #624: module-wide Robolectric defaults for the :app Compose UI tests.

# Use a PLAIN Application, not the app's own TinkerRocketApp.
#
# Robolectric instantiates the manifest's application class and runs its
# onCreate before any test body. TinkerRocketApp.onCreate builds AppContainer,
# which calls MapLibre.getInstance() -- and MapLibre GL Native is a JNI
# library with no JVM build, so every test in the module dies in setup with
# UnsatisfiedLinkError on NativeConnectivityListener.initialize before a
# single line of test code runs.
#
# Nothing is lost by skipping it. These tests drive composables directly with
# explicit state; none of them reads the real container, and a test that needs
# a collaborator should be handed a fake rather than reaching for a global.
# A test that genuinely needs the real Application can override this with
# @Config(application = TinkerRocketApp::class) -- and will then have to solve
# the native-library problem that this line sidesteps.
application=android.app.Application

# Emulate the SDK the app actually targets, so the semantics and layout under
# test are the ones that ship. Robolectric would otherwise pick targetSdk
# anyway; naming it here means a targetSdk bump is a deliberate, visible edit
# to the test environment rather than a silent one.
sdk=36
