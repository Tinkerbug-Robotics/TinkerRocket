name: Unit Tests (Python)

# tests/unit/ and tests/test_roll_profile_semantics.py were invoked by NO
# workflow (#836 item 6).  sim-tests.yml looks like it covers them — it runs
# `python -m pytest tests/ -v` — but that step sets
# `working-directory: tinkerrocket-sim`, so it collects tinkerrocket-sim/tests/,
# an entirely different tree.  Five suites and 48 assertions ran only when
# somebody remembered to run them by hand.

on:
  push:
    paths:
      - 'Data_Analysis/**'
      - 'tests/unit/**'
      - 'tests/test_roll_profile_semantics.py'
      # test_bs_log_reader reads this header at runtime and asserts the Python
      # reader's field offsets still match the C structs.
      - 'tinkerrocket-idf/components/TR_RocketComputerTypes/**'
      # test_apogee_detector and the landing suites mirror this component's
      # logic in Python; the port has to be re-checked when it moves.
      - 'tinkerrocket-idf/components/TR_KinematicChecks/**'
      # test_ota_probe drives tools/ota_probe.py end to end, and reads
      # APP_DESC_OFFSET/SIZE out of the receiver header to check the probe
      # still sends enough bytes to force an identity verdict.
      - 'tools/ota_probe.py'
      - 'tinkerrocket-idf/components/TR_OTA/**'
      # test_deployment_replay_shim compiles the deployment replay against the
      # FC's config.h and board headers; #808 broke that build with a
      # config.h-only change, which would not have triggered this workflow.
      - 'tinkerrocket-idf/projects/flight_computer/main/config.h'
      - 'tinkerrocket-idf/projects/flight_computer/main/board/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'Data_Analysis/**'
      - 'tests/unit/**'
      - 'tests/test_roll_profile_semantics.py'
      - 'tinkerrocket-idf/components/TR_RocketComputerTypes/**'
      - 'tinkerrocket-idf/components/TR_KinematicChecks/**'
      - 'tools/ota_probe.py'
      - 'tinkerrocket-idf/components/TR_OTA/**'
      - 'tinkerrocket-idf/projects/flight_computer/main/config.h'
      - 'tinkerrocket-idf/projects/flight_computer/main/board/**'
      - '.github/workflows/unit-tests.yml'

jobs:
  # NOT "unit": android-tests.yml already has a job by that name, and GitHub
  # lists checks by JOB name, so two workflows called "unit" are two
  # indistinguishable rows on any PR that triggers both.  Introduced by #935;
  # caught on #941, where the only "unit" rows were in fact Android's.
  python-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Same set flight-report-tests.yml installs: every suite here resolves
      # its imports against Data_Analysis/, which needs all of these.
      - name: Install dependencies
        run: pip install numpy matplotlib jinja2 pandas pytest

      - name: Run unit tests
        run: python -m pytest tests/unit/ tests/test_roll_profile_semantics.py -v --tb=short
