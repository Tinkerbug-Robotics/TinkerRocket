name: Flight Report (Python)

on:
  push:
    paths:
      - 'Data_Analysis/**'
      - 'tests/test_flight_report.py'
      - 'tests/js/**'
      - 'tests/test_data/flight_*.bin'
      - '.github/workflows/flight-report-tests.yml'
  pull_request:
    paths:
      - 'Data_Analysis/**'
      - 'tests/test_flight_report.py'
      - 'tests/js/**'
      - 'tests/test_data/flight_*.bin'
      - '.github/workflows/flight-report-tests.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install numpy matplotlib jinja2 pandas pytest

      - name: Run flight_report smoke test
        run: python -m pytest tests/test_flight_report.py -v --tb=short

  # The Explore panel decides what to draw in JavaScript, so that logic is tested
  # in JavaScript. Node's own runner, no package.json and no dependencies — the
  # module under test is plain ESM that the report inlines verbatim.
  explore-js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run Explore panel tests
        run: node --test tests/js/explore.test.mjs
