name: Firmware Build (ESP-IDF)

on:
  push:
    paths:
      - 'tinkerrocket-idf/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'tinkerrocket-idf/**'
      - '.github/workflows/firmware-build.yml'

# The `secrets` context isn't available in step-level `if:`, so surface the
# private-submodule token as a boolean here for the force-checkout step below.
env:
  HAS_GUIDANCE_TOKEN: ${{ secrets.TR_GUIDANCEPN_TOKEN != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1

    strategy:
      fail-fast: false
      matrix:
        include:
          # Grouped by product line. `line` only labels the job; `project` is the
          # CMake project name and `path` (when present) the folder under
          # tinkerrocket-idf/projects/ for the projects that moved into legacy/ or
          # bench/. Project names did NOT change with the 2026-09-24 product
          # rename: both apps refuse an OTA image whose project name is not the
          # unit's own, so those names are the update contract with every board
          # already in the field.
          #
          # ---- Product line: what firmware-release.yml publishes -------------
          #
          # Tinker-Mantis (hardware/tinker-mantis) is the V9/V10 board. Both halves
          # take -DTR_BOARD_V9=1. flight_computer has no default board revision:
          # the flag is mandatory (projects/flight_computer/main/CMakeLists.txt)
          # because a wrong pyro pin map is silent at runtime. out_computer's flag
          # is mandatory too (#834) — a flagless build used to compile the V7 map
          # silently. V9/V10 deleted the MRAM (board_v9.h sets MRAM_CS = -1) and
          # enables the PSRAM log ring via an sdkconfig overlay.
          - line: Tinker-Mantis
            project: flight_computer
            board: V9
            flags: -B build_v9 -DTR_BOARD_V9=1
          - line: Tinker-Mantis
            project: out_computer
            board: V9
            flags: -B build_v9 -DTR_BOARD_V9=1
          # Tinker-Beetle (hardware/tinker-beetle, fabbed as rocket-computer-mini-
          # v1.0.1) is a two-ESP32-S3 board that runs out_computer and
          # flight_computer with -DTR_BOARD_M1=1 — not the single-MCU
          # rocket_computer_mini project under legacy/, which targets a shape that
          # was never fabbed (#1188). M1 is the one flight computer that is NOT an
          # ESP32-P4: sdkconfig.defaults.m1 changes CONFIG_IDF_TARGET as well as
          # the pin map, and the project CMakeLists forces the target into a build
          # dir of its own. The out computer shares the V9 PSRAM overlay but has
          # its own pin map: the radio is on-board SPI and there is no GNSS/LoRa
          # rail switch of its own.
          - line: Tinker-Beetle
            project: flight_computer
            board: M1
            flags: -B build_m1 -DTR_BOARD_M1=1
          - line: Tinker-Beetle
            project: out_computer
            board: M1
            flags: -B build_m1 -DTR_BOARD_M1=1
          # Tinker-Base (hardware/tinker-base) runs base_station. It has no board
          # map of its own yet, so the product build is the one it starts from:
          # V3, the full base station (PCB V5/V6, now hardware/legacy/base-station),
          # which drives a lora-daughterboard over UART where the Tinker-Base has
          # its radio on board over SPI. V3 needs its own overlay:
          # sdkconfig.defaults.v3 is 16 MB plus the partitions_v3.csv whose
          # 9.94 MB spiffs does not fit an 8 MB part at all.
          - line: Tinker-Base
            project: base_station
            board: V3
            flags: -B build_v3 -DTR_BS_BOARD=3
          # The LoRa daughterboard that pairs with Tinker-Mantis.
          - line: LoRa
            project: radio_board
          #
          # ---- Legacy: kept building, never released on fw-v* ----------------
          #
          # Released only on fw-legacy-v* tags (firmware-release-legacy.yml). V7
          # was the one gap (#413): flight_computer built V7 and out_computer did
          # not, so this job could go green on a change that broke half of a V7
          # pair — and #413's acceptance criterion is exactly "a PR that breaks
          # the V7 build fails CI". It is an 8 MB part rather than V9's 16 MB, so
          # nothing about it is covered by V8. V8 and V9 differ on ARM and swap
          # FIRE 2/3, so V8 needs its own build too. Their maps live in
          # main/board/legacy/.
          - line: legacy
            project: flight_computer
            board: V7
            flags: -B build_v7 -DTR_BOARD_V7=1
          - line: legacy
            project: flight_computer
            board: V8
            flags: -B build_v8 -DTR_BOARD_V8=1
          - line: legacy
            project: out_computer
            board: V7
            flags: -B build_v7 -DTR_BOARD_V7=1
          - line: legacy
            project: out_computer
            board: V8
            flags: -B build_v8 -DTR_BOARD_V8=1
          # base_station's flag is optional and defaults to V2 (a superseded
          # revision, main/board/legacy/board_v2.h). V1/V2 fit an 8 MB W25Q64 and
          # share the base flash layout; build the default so it does not rot
          # unbuilt behind the V3 overlay.
          - line: legacy
            project: base_station
            board: V2-default
          # The single-MCU merge for the never-fabbed S3-alone mini.
          - line: legacy
            project: rocket_computer_mini
            path: legacy/rocket_computer_mini
          #
          # ---- Bench tools: never released -----------------------------------
          #
          # pyro_channel_test drives squib FETs by hand and was not built by CI
          # at all. Its flag is mandatory too (#834): V7's PYRO1 FIRE pin is
          # PYRO_ARM on V9, so a flagless build armed the board on the keypress
          # meant to pulse channel 1. Build every map so none of them rots.
          - line: bench
            project: pyro_channel_test
            path: bench/pyro_channel_test
            board: V7
            flags: -B build_v7 -DTR_BOARD_V7=1
          - line: bench
            project: pyro_channel_test
            path: bench/pyro_channel_test
            board: V8
            flags: -B build_v8 -DTR_BOARD_V8=1
          - line: bench
            project: pyro_channel_test
            path: bench/pyro_channel_test
            board: V9
            flags: -B build_v9 -DTR_BOARD_V9=1

    steps:
      - uses: actions/checkout@v5

      # TR_GuidancePN is a private submodule marked `update = none` in
      # .gitmodules so recursive clones (Xcode Cloud, casual
      # `--recurse-submodules`) skip the private repo instead of failing on it
      # (#255). On trusted branches the TR_GUIDANCEPN_TOKEN secret is present
      # and we DO want real guidance coverage, so force the checkout here,
      # overriding the `none` update mode. Forks / PRs without the token skip
      # this step and flight_computer's CMakeLists picks up the
      # TR_GuidancePN_Stub component instead (no-op API).
      - name: Check out private TR_GuidancePN (trusted branches only)
        if: ${{ env.HAS_GUIDANCE_TOKEN == 'true' }}
        env:
          TR_GUIDANCEPN_TOKEN: ${{ secrets.TR_GUIDANCEPN_TOKEN }}
        run: |
          # actions/checkout marks the workspace safe for its own git calls;
          # this manual submodule call needs the same exception because the
          # espressif container runs git as a different uid than the workspace
          # owner ("detected dubious ownership" otherwise).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${TR_GUIDANCEPN_TOKEN}@github.com/".insteadOf "https://github.com/"
          git -c submodule."tinkerrocket-idf/components/TR_GuidancePN".update=checkout \
            submodule update --init --recursive tinkerrocket-idf/components/TR_GuidancePN

      - name: Build ${{ matrix.line }} ${{ matrix.project }} ${{ matrix.board }}
        working-directory: tinkerrocket-idf/projects/${{ matrix.path || matrix.project }}
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py ${{ matrix.flags }} build
