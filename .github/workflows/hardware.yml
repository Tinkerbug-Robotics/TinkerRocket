name: hardware

# Scoped to hardware/ on purpose. The gate below was born RED on
# rocket-computer (#833: Q11 is in the schematic and not in the layout), and
# firmware/app work should not be blocked by a board defect it cannot fix.
on:
  push:
    paths: ['hardware/**', 'tools/check_board_parity.py', '.github/workflows/hardware.yml']
  pull_request:
    paths: ['hardware/**', 'tools/check_board_parity.py', '.github/workflows/hardware.yml']

jobs:
  board-parity:
    # Nothing in CI validated hardware/ before this, and
    # `kicad-cli pcb drc --schematic-parity` looks footprints up by reference,
    # so it misses both things checked here:
    # - a footprint missing from the layout entirely. #833 shipped that far:
    #   the flight battery's positive terminal reached nothing but a floating
    #   pour.
    # - a footprint whose (path ...) does not lead back to its symbol. Update
    #   PCB links by path, so on 2026-09-28 it replaced tinker-base's J2, R13
    #   and R16 with fresh copies off the board edge, their tracks dangling.
    #
    # Pure Python, no KiCad on the runner, so it costs seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Every board-bound symbol has a footprint, linked to it by path
        run: python3 tools/check_board_parity.py
