name: Docs

# Documentation checks. Two kinds:
#
#   1. Generated artifacts (section maps, protocol reference) must match the
#      sources they were extracted from. Each generator re-runs with --check.
#   2. Hand-written prose must agree with the source on the facts a machine can
#      verify -- links resolve, the IDF version matches CI, the workflow list is
#      complete, quoted struct sizes match the wire.
#
# DELIBERATELY NOT PATH-FILTERED. Every other workflow in this repo is, which
# is correct for them -- there is no point compiling firmware for a README typo.
# It is wrong here. Documentation drifts *because of* changes elsewhere: the
# README's ESP-IDF version went stale when the toolchain moved, its struct sizes
# went stale when a field was added, its workflow list went stale when workflows
# were added. A path filter listing "everything that could invalidate the docs"
# is the same unbounded list as "everything", and PR #594 -- a README-only
# change -- ran no checks at all because nothing matched it.
#
# The whole job is ~15 s of pure-stdlib Python, so running it on every push and
# every PR costs less than maintaining the filter would.
#
# This is also why the docs checks are NOT duplicated into the other six
# workflows: one always-on job covers every change, and a check that lives in
# one place cannot fall out of sync with copies of itself.

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every step below is pure stdlib (re, argparse, pathlib); ubuntu-latest
      # ships python3, so there is nothing to install.

      - name: Check the generated section maps match the firmware sources
        run: python3 tools/gen_section_index.py --check

      - name: Check the design tokens match design/tokens.json
        run: python3 tools/gen_design_tokens.py --check

      - name: Check the protocol reference matches the wire definitions
        run: python3 tools/gen_protocol_reference.py --check

      # #916. Over-declaring boot-NOR size boot-loops a board before app_main,
      # so no runtime assertion can catch it and no host test can either. What
      # a static check CAN catch is the tell that preceded the last occurrence:
      # a declaration that does not cover its own partition table, or two
      # processors on one physical board disagreeing about the part fitted to
      # it. Cheap, and it runs on every PR because this job is not path-filtered.
      - name: Check the boot-NOR declarations against the partition tables
        run: python3 tinkerrocket-idf/tools/check_flash_declarations.py

      # #773 / PR #1323. The out computer read its provisioned board revision
      # at the top of setup_oc(), two hundred lines above its own
      # nvs_flash_init() -- which is late on purpose, behind the #825 rail
      # race. The open failed with ESP_ERR_NVS_NOT_INITIALIZED on every boot
      # and a provisioned board reported "unprovisioned" forever; the base
      # station shipped the same shape in #500. No host test can compile a
      # boot function and the wrapper only logs, but a static check can see
      # a default-partition open sitting ahead of the init in the same body.
      - name: Check no NVS open precedes nvs_flash_init() in a boot function
        if: '!cancelled()'
        run: python3 tinkerrocket-idf/tools/check_nvs_boot_order.py

      # #1117, and again 2026-09-22. A flight-computer handler that reads a
      # config frame with no retry on a miss loses the setting for good: the
      # dedup key keeps the command and the OC's remaining repeats are
      # skipped. #1117 fixed pyro and called it the only one; nine more turned
      # up later. The handlers are branches of the main loop, out of reach of
      # any host test, but the if/else around each readConfigFrame() is plain
      # to see.
      - name: Check every FC config-frame read retries on a miss
        if: '!cancelled()'
        run: python3 tinkerrocket-idf/tools/check_config_retry.py

      # Runs even if a generator check above failed, so one PR surfaces every
      # documentation problem at once instead of one per push.
      - name: Check the prose agrees with the source
        if: '!cancelled()'
        run: python3 tools/check_docs.py
