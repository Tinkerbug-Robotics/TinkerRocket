name: Firmware Release

# Firmware images and a manifest, attached to a GitHub release on tag push
# (#773 step 3).  Tag scheme: fw-v<semver>, e.g. fw-v1.0.0.
#
# PRODUCT LINE ONLY (2026-09-24): Tinker-Mantis, Tinker-Beetle, Tinker-Base and
# the LoRa daughterboard. Firmware for retired boards (V7/V8, the V1/V2 base
# station, the single-MCU mini) is built by firmware-release-legacy.yml on its
# own fw-legacy-v* tags, which neither app ever offers — both look for a tag
# starting fw-v, and fw-legacy-v does not. Keep the two workflows' build,
# manifest and publish steps in step; only the matrix and the release wording
# differ. The matrix here must equal the product-line group of
# firmware-build.yml.
#
# Why this exists: `firmware-build.yml` compiles every configuration and
# uploads NOTHING — it ends at `idf.py build`.  So there has never been an
# artifact to distribute, and anyone updating a board had to build it
# themselves or be sent a file.  #773's acceptance line is "cutting a firmware
# release is a tag push", and this is it.
#
# What is published: the APP image per configuration, which is what OTA
# flashes, named for the product it belongs to
# (tinker-mantis-flight_computer-V9.bin). The CMake project names inside the
# images did not change with the product rename, because both apps refuse an
# image whose project name is not the unit's own.  Bootloader and partition
# table are deliberately NOT here — those are a first-flash-over-USB concern
# and shipping them beside an OTA image invites someone to push the wrong one
# over the air.
#
# `pyro_channel_test` is excluded on purpose.  It drives squib FETs by hand
# and is a bench tool, not a flight image; it has no business in a list an app
# offers to flash.
#
# Also runnable by hand as a dry run, following android-release.yml: same
# builds, same manifest, same verification, stopping before the release is
# created.  A tag push is otherwise the only way this runs, which would leave
# every change to it untested until the one moment it must not fail.

on:
  push:
    tags:
      - 'fw-v*'
  workflow_dispatch:
    inputs:
      simulated_tag:
        description: 'Tag to build the manifest against, e.g. fw-v1.0.0. Blank uses fw-v0.0.0-dryrun.'
        required: false
        default: ''

env:
  HAS_GUIDANCE_TOKEN: ${{ secrets.TR_GUIDANCEPN_TOKEN != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    strategy:
      fail-fast: true   # a release must be all-or-nothing
      matrix:
        include:
          # Tinker-Mantis: both halves of the V9/V10 board.
          - line: Tinker-Mantis
            asset: tinker-mantis-flight_computer-V9
            project: flight_computer
            flags: -B build_v9 -DTR_BOARD_V9=1
          - line: Tinker-Mantis
            asset: tinker-mantis-out_computer-V9
            project: out_computer
            flags: -B build_v9 -DTR_BOARD_V9=1
          # Tinker-Beetle: both ESP32-S3s of the M1 board.
          - line: Tinker-Beetle
            asset: tinker-beetle-flight_computer-M1
            project: flight_computer
            flags: -B build_m1 -DTR_BOARD_M1=1
          - line: Tinker-Beetle
            asset: tinker-beetle-out_computer-M1
            project: out_computer
            flags: -B build_m1 -DTR_BOARD_M1=1
          # Tinker-Base: base_station's V3 build is the starting point until the
          # Tinker-Base has a board map of its own (on-board SPI radio).
          - line: Tinker-Base
            asset: tinker-base-base_station-V3
            project: base_station
            flags: -B build_v3 -DTR_BS_BOARD=3
          # The LoRa daughterboard that pairs with Tinker-Mantis.
          - line: LoRa
            asset: lora-daughterboard-radio_board
            project: radio_board
            flags: -B build

    steps:
      - uses: actions/checkout@v5

      # Same force-checkout as firmware-build.yml: guidance is a private
      # submodule marked `update = none`, and a release build must carry the
      # real component rather than silently falling back to the stub (#255).
      - name: Check out private TR_GuidancePN
        if: ${{ env.HAS_GUIDANCE_TOKEN == 'true' }}
        env:
          TR_GUIDANCEPN_TOKEN: ${{ secrets.TR_GUIDANCEPN_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${TR_GUIDANCEPN_TOKEN}@github.com/".insteadOf "https://github.com/"
          git -c submodule."tinkerrocket-idf/components/TR_GuidancePN".update=checkout \
            submodule update --init --recursive tinkerrocket-idf/components/TR_GuidancePN

      # A release image must NOT be built on a guidance stub. firmware-build.yml
      # tolerates the stub so forks can build; a release cannot, because the
      # resulting image would fly with guidance silently absent.
      - name: Refuse to release a stubbed guidance build
        if: ${{ matrix.project == 'flight_computer' && env.HAS_GUIDANCE_TOKEN != 'true' }}
        run: |
          echo "TR_GUIDANCEPN_TOKEN is not available — a flight_computer release" >&2
          echo "image would carry the guidance STUB. Refusing." >&2
          exit 1

      - name: Build ${{ matrix.asset }}
        working-directory: tinkerrocket-idf/projects/${{ matrix.path || matrix.project }}
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py ${{ matrix.flags }} build

      # Name the artifact for the product it belongs to, not for the build dir.
      # The image's own header still carries the authoritative project and
      # version — the filename is a convenience, and the manifest is built by
      # reading the header rather than by trusting this name.
      - name: Stage the app image
        shell: bash
        run: |
          cd tinkerrocket-idf/projects/${{ matrix.path || matrix.project }}
          BUILD=$(echo "${{ matrix.flags }}" | sed -n 's/.*-B \([^ ]*\).*/\1/p')
          mkdir -p "$GITHUB_WORKSPACE/staging"
          cp "$BUILD/${{ matrix.project }}.bin" \
             "$GITHUB_WORKSPACE/staging/${{ matrix.asset }}.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.asset }}
          path: staging/*.bin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: fw-*
          merge-multiple: true

      # The manifest is built by READING each image's esp_app_desc_t, not from
      # the matrix. If a build ever produced an image for a different project
      # than its directory implies, the manifest says what is actually in the
      # file — and image_info.py refuses anything that is not an ESP-IDF image
      # at all, so an empty or truncated artifact fails the release here rather
      # than reaching a phone.
      - name: Build the manifest
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.simulated_tag }}"
            [ -n "$TAG" ] || TAG="fw-v0.0.0-dryrun"
          fi
          ls -l artifacts
          python3 tinkerrocket-idf/tools/image_info.py --manifest "$TAG" artifacts/*.bin \
            > artifacts/manifest.json
          cat artifacts/manifest.json
          # Every configuration in the matrix must be present. A partial
          # release is worse than none: the app would offer a catalog with
          # holes and no way to know they are holes.
          COUNT=$(python3 -c "import json,sys; print(len(json.load(open('artifacts/manifest.json'))['images']))")
          if [ "$COUNT" -ne 6 ]; then
            echo "manifest has $COUNT images, expected 6 — refusing to publish" >&2
            exit 1
          fi

      - name: Attach the images and manifest to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with anything after the version — fw-v0.0.1-rc1, fw-v1.0.0-beta
          # — publishes as a prerelease. `gh release create` does NOT infer this
          # from the tag, so without the flag an -rc1 goes out as the newest
          # full release and every app in the field offers it as an update.
          # Both apps' FirmwareReleaseLocator skips prereleases unless asked, so
          # this is what makes a live release testable without shipping it.
          VERSION="${GITHUB_REF_NAME#fw-v}"
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease"
                 echo "tag $GITHUB_REF_NAME has a suffix — publishing as a PRERELEASE" ;;
            *)   echo "tag $GITHUB_REF_NAME is a full release" ;;
          esac
          # --notes is prepended to the generated notes: which file is which.
          gh release create "$GITHUB_REF_NAME" artifacts/*.bin artifacts/manifest.json \
            --title "TinkerRocket firmware ${GITHUB_REF_NAME#fw-}" \
            --notes "$(printf '%s\n' \
              '| Product | Images |' \
              '|---|---|' \
              '| Tinker-Mantis | `tinker-mantis-flight_computer-V9.bin`, `tinker-mantis-out_computer-V9.bin` |' \
              '| Tinker-Beetle | `tinker-beetle-flight_computer-M1.bin`, `tinker-beetle-out_computer-M1.bin` |' \
              '| Tinker-Base | `tinker-base-base_station-V3.bin` |' \
              '| LoRa daughterboard | `lora-daughterboard-radio_board.bin` |' \
              '' \
              'Firmware for retired boards is published separately on `fw-legacy-v*` tags.')" \
            --generate-notes $PRERELEASE
