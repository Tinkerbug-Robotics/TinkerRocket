name: CI Gate

# The one check branch protection requires on main, so "merge on green" means
# every check that ran passed, not just the first one to finish.
#
# Why a gate instead of requiring the real checks: every workflow but docs.yml
# is path-filtered, and GitHub treats a required check that never ran as still
# pending.  Require ios-tests and a firmware-only PR waits forever.  This job
# is NOT path-filtered, so it always reports; it waits for whatever checks the
# PR's head commit did trigger, and fails if any of them failed.
#
# Re-running a failed check does not re-run this gate.  Re-run the gate too
# (or push), or it stays red.

on:
  pull_request:

permissions:
  checks: read
  statuses: read

concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Wait for every other check on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: ci-gate
        run: |
          # Grace period: the other workflows' check runs appear a few seconds
          # after the push, and an empty list must not read as "all passed".
          sleep 60
          while true; do
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                     --jq ".check_runs[] | select(.name != \"$SELF\") | [.name, .status, (.conclusion // \"\")] | @tsv")
            statuses=$(gh api "repos/$REPO/commits/$SHA/status" \
                     --jq '.statuses[] | [.context, .state] | @tsv')

            pending=$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $2 != "completed"' | wc -l)
            pending=$((pending + $(printf '%s\n' "$statuses" | awk -F'\t' 'NF && $2 == "pending"' | wc -l)))
            failed=$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $2 == "completed" && $3 !~ /^(success|neutral|skipped)$/ {print $1" ("$3")"}')
            failed+=$(printf '%s\n' "$statuses" | awk -F'\t' 'NF && $2 ~ /^(failure|error)$/ {print $1" ("$2")"}')

            if [ -n "$failed" ]; then
              echo "::error::Failing checks:"
              printf '%s\n' "$failed"
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All $(printf '%s\n' "$runs" | grep -c .) checks passed."
              exit 0
            fi
            echo "$pending check(s) still running..."
            sleep 30
          done
