name: Android Tests (JVM)

# Pure-JVM tests for the Android app's :core:* modules — no emulator, no
# Android SDK (the modules are kotlin("jvm"); see docs/plans/624-android-port.md
# §1).  The fixtures path matters: a golden-corpus regeneration must re-verify
# the Kotlin decoders, exactly as ios-tests re-verifies the Swift ones —
# together with cpp-tests' freshness gtest that is the three-way parity gate
# (plan §2.5).

on:
  push:
    paths:
      - 'TinkerRocketAndroid/**'
      - 'tests_cpp/fixtures/wire/**'
      - 'tools/check_android_tests_ran.py'
      - 'tools/check_android_api_level.py'
      - '.github/workflows/android-tests.yml'
  pull_request:
    paths:
      - 'TinkerRocketAndroid/**'
      - 'tests_cpp/fixtures/wire/**'
      - 'tools/check_android_tests_ran.py'
      - 'tools/check_android_api_level.py'
      - '.github/workflows/android-tests.yml'

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      # No submodules: protocol/session code never touches TR_GuidancePN.
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Wrapper validation + build caching.
      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests (golden walk included)
        run: ./gradlew --no-daemon test
        working-directory: TinkerRocketAndroid

      # JUnit 5 does not run a test method whose return type is not void, and
      # nothing reports that it didn't: the step above stays green with fewer
      # cases than the sources declare. Kotlin gets there by accident -- an
      # expression-bodied @Test ending in assertIs/assertNotNull returns the
      # narrowed value -- and FirmwareReleaseTest shipped 2 of 13 cases that
      # way (#773 step 4b). So, per module: every @Test under src/test must be
      # in the JUnit XML the step above just wrote.
      - name: Every declared @Test ran
        run: python3 tools/check_android_tests_ran.py

      # :core:protocol, :core:session and :core:maps compile against JDK 21,
      # where every Java 9+ API exists, and lint's NewApi check skips
      # kotlin("jvm") modules. That is how InputStream.readNBytes (API 33)
      # reached a minSdk-31 app and crashed the firmware download on Android
      # 12 (#1612). So no module's main classes may call a Java or Android API
      # above minSdk. Reads the classes the test step compiled, and the runner
      # image's SDK: api-versions.xml for platform android-36, and D8's
      # backport list from build-tools 36.1.0.
      - name: No API above minSdk
        run: python3 tools/check_android_api_level.py
