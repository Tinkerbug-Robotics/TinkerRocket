; The rig's IQ files, as the stage-0 receiver reads them. Metadata only: the
; files never enter git. They live in the COCOM rig's tools/gnss-cocom/sdr/c8/;
; point $GNSS_IQ_DIR there.
;
; fs, fc          sample rate and centre frequency, Hz. Most large files have no .TXT sidecar.
; generator       gps-sdr-sim or signalsim.
; noise           yes if the file already carries receiver noise. gps-sdr-sim files carry
;                 none: read directly they behave like ~49 dB-Hz, a floor set by the other
;                 satellites' codes, so add noise with --cn0.
; dc              I,Q offset to remove (LSB), or auto (measured on the segment's first second).
;                 gps-sdr-sim truncates, which leaves about -0.47 LSB on each component.
; carrier_fix_hz  carrier-only shift. The _cofs builds generate the carrier 22.0 Hz low to
;                 cancel the HackRF's +22 Hz (tools/gnss-cocom/sdr/patch_carrier_offset.py);
;                 read directly, +22.0 puts carrier and code back in step.
; sig_power       one satellite's carrier power C, LSB^2, complex baseband (measured; see measured_by).
; noise_density   N0 already in the file, LSB^2/Hz.
; start_gpst      GPS time of the first sample, when known.
; truth           static:LAT,LON,HEIGHT, or the rig's scenarios/ CSV (10 Hz t,lat,lon,h).
; iono_params     the Klobuchar alpha0..3, beta0..3 the generator applied. Subframe 4 page 18 repeats only
;                 every 12.5 min, so a short file never delivers them; gnssrx preloads these instead.
; tropo           none if the generator applied no troposphere (gps-sdr-sim); else Saastamoinen.

; ---- SignalSim (github.com/globsky/SignalSim; no licence: use its files, never its code) ----
; Configs: ~/Projects/ModelRockets/bench-backups/signalsim-builds/2026-09-30_gps-almanac-fix/tinkerrocket/

[signalsim_static_gpsgal_2026_45_n.C8]
; ionosphere: Klobuchar with the RINEX header's GPSA/GPSB; troposphere: Saastamoinen
iono_params = 1.0245e-08,2.2352e-08,-5.9605e-08,-1.1921e-07,1.0035e+05,1.3107e+05,-6.5536e+04,-3.9322e+05
generator = signalsim
fs = 8184000
fc = 1575420000
noise = yes
dc = 0,0
carrier_fix_hz = 0
; "45 dB-Hz" in the config MEASURES 41.0 dB-Hz (sd 0.3 over the 13 GPS satellites)
sig_power = 2.19
noise_density = 1.74e-4
measured_by = py/emul_check.py 2026-09-30, 5.0-5.5 s; N0 includes the other satellites' codes
start_gpst = 2026-08-18 08:30:00
truth = static:0.0,-119.0,1200.0
config = static_gpsgal_2026_45_n.json
signals = GPS L1CA (PRN 5 6 11 12 14 15 19 20 21 22 24 29 30), Galileo E1 (10)
duration_s = 240

[signalsim_traveler_gpsgal_2026_45_n.C8]
; ionosphere: Klobuchar with the RINEX header's GPSA/GPSB; troposphere: Saastamoinen
iono_params = 1.0245e-08,2.2352e-08,-5.9605e-08,-1.1921e-07,1.0035e+05,1.3107e+05,-6.5536e+04,-3.9322e+05
generator = signalsim
fs = 8184000
fc = 1575420000
noise = yes
dc = 0,0
carrier_fix_hz = 0
sig_power = 2.19
noise_density = 1.74e-4
measured_by = assumed equal to the static file (same generator settings)
start_gpst = 2026-08-18 08:30:00
truth = scenarios/traveler_soft25_pad600.csv
config = traveler_gpsgal_2026_45_n.json
duration_s = 1255.9

[signalsim_static_all_2026_45_w.C8]
; ionosphere: Klobuchar with the RINEX header's GPSA/GPSB; troposphere: Saastamoinen
iono_params = 1.0245e-08,2.2352e-08,-5.9605e-08,-1.1921e-07,1.0035e+05,1.3107e+05,-6.5536e+04,-3.9322e+05
generator = signalsim
fs = 18480000
fc = 1568286000
noise = yes
dc = 0,0
carrier_fix_hz = 0
; measures 41.3 dB-Hz at 18.48 MS/s; the 6.75 MS/s 2-bit stream 0.7 dB below that (the 4.2 MHz
; front end drops the sidelobe power this wide file carries)
sig_power = 1.033
noise_density = 7.64e-5
measured_by = py/emul_check.py 2026-09-30, 5.0-5.5 s, 7 GPS satellites
start_gpst = 2026-08-18 08:30:00
truth = static:0.0,-119.0,1200.0
config = static_all_2026_45_w.json
signals = GPS L1CA, Galileo E1, BeiDou B1I (B1I sits 7.19 MHz below centre)
duration_s = 240

; ---- gps-sdr-sim (osqzss/gps-sdr-sim, MIT), the rig's smooth-carrier build ----

[hotshot_pad600_smooth_cofs_g8.C8]
; ionosphere: the 5 ns night term only (Klobuchar with zero coefficients: its RINEX 2 file has no ION
; ALPHA/BETA); no troposphere. Measured: +3.4 m height error if left uncorrected
iono_params = 0,0,0,0,0,0,0,0
tropo = none
generator = gps-sdr-sim
fs = 2600000
fc = 1575420000
noise = no
dc = auto
carrier_fix_hz = 22.0
; read directly: 50.0 dB-Hz, the floor of the other satellites' codes. --cn0 sets the added
; thermal noise; the correlator then measures less: 45 -> 43.7 unquantized (the floor), 42.8 in
; the 2-bit 6.75 MS/s stream (the file's signal stops at +-1.3 MHz while the emulated front
; end's noise fills +-2.1 MHz, ~0.5 dB beyond the usual 2-bit loss)
sig_power = 0.947
noise_density = 0
measured_by = py/emul_check.py 2026-09-30, 100.0-100.5 s, 14 GPS satellites (sd 0.006)
truth = scenarios/hotshot_pad600.csv
duration_s = 900

