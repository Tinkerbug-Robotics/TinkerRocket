[signalsim_static_gpsgalb1c_2026_45_n.C8]
; Made 2026-10-01 by the rig session for milestone 6: the static gpsgal file's settings plus BeiDou
; B1C, 300 s. SignalSim's B1C (from its source, per the rig session):
; - data: sine BOC(1,1) on -Q, amplitude 1/2 (d = +1 for bit 0);
; - pilot: BOC(1,1) on I, amplitude sqrt(29/44), with the 1800-chip secondary code. The QMBOC's
;   BOC(6,1) part is left out, so a BOC(1,1) replica is matched; Galileo E1 is BOC(1,1), not CBOC.
; - Expected C/N0 against GPS L1CA: pilot -1.81 dB, data -6.02 dB.
; - BDT = GPST - 14 s. B1C is delayed by the RINEX B1I TGD1, and every signal (B1C too) by GPS
;   Klobuchar; B-CNAV1's BDGIM fields are zeros.
; ionosphere: Klobuchar with the RINEX header's GPSA/GPSB; troposphere: Saastamoinen
iono_params = 1.0245e-08,2.2352e-08,-5.9605e-08,-1.1921e-07,1.0035e+05,1.3107e+05,-6.5536e+04,-3.9322e+05
generator = signalsim
fs = 8184000
fc = 1575420000
noise = yes
dc = 0,0
carrier_fix_hz = 0
; GPS L1CA measures 40.9 dB-Hz (sd 0.3 over 13 satellites), as in the gpsgal file
sig_power = 2.19
noise_density = 1.771e-4
measured_by = py/emul_check.py 2026-10-01, 5.0-5.5 s; N0 includes the other satellites' codes
start_gpst = 2026-08-18 08:30:00
truth = static:0.0,-119.0,1200.0
nav = BRDC_2026230_MN.rnx
config = static_gpsgalb1c_2026_45_n.json
signals = GPS L1CA (PRN 5 6 11 12 14 15 19 20 21 22 24 29 30), Galileo E1 (7 13 15 19 21 26 27 29 30 33), BeiDou B1C (19 21 22 26 29 31 35 36 39)
duration_s = 300

[signalsim_traveler_gpsgal_2026_50e_n_cofs.C8]
; The rig session's traveler for SignalSim (2026-09-30): traveler_gpsgal_2026_45_n.json's flight (the
; report's traveler, soft25, pad 600 s; one 0.1 s VerticalAcc segment per row of
; scenarios/traveler_soft25_pad600.csv, altitude within ~1 m of it, lift-off after 600.1 s) at
; 50 dB-Hz at the zenith, power scaled by elevation as in static_gpsgal_2026_50e_n (SignalSim's fade:
; C/N0 -= 25 (1 - sqrt(sin el)) dB), with the carrier generated 22.0 Hz low for HackRF playback.
; Its config is not in the backup above; this entry was measured from the file.
; ionosphere: Klobuchar with the RINEX header's GPSA/GPSB; troposphere: Saastamoinen
iono_params = 1.0245e-08,2.2352e-08,-5.9605e-08,-1.1921e-07,1.0035e+05,1.3107e+05,-6.5536e+04,-3.9322e+05
generator = signalsim
fs = 8184000
fc = 1575420000
noise = yes
dc = 0,0
; code-minus-carrier grows at -4.19 m/s on all 14 satellites read without a fix (gnssrx, 36-80 s)
carrier_fix_hz = 22.0
; sig_power is the zenith level: a satellite's C is this less the fade, so --cn0 sets the zenith's C/N0.
; Measured on 7 GPS satellites at 27-71 deg, each put back to the zenith by the fade: 46.5 dB-Hz (sd 0.25)
sig_power = 7.2
noise_density = 1.61e-4
measured_by = py/emul_check.py 2026-10-01, 100.0-100.5 s; N0 includes the other satellites' codes
start_gpst = 2026-08-18 08:30:00
truth = scenarios/traveler_soft25_pad600.csv
nav = BRDC_2026230_MN.rnx
signals = GPS L1CA, Galileo E1
duration_s = 1255.9

