<title>Phoenix COCOM Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">

<style>
  :root {
    --ground:      #F6F7F9;
    --surface:     #FFFFFF;
    --surface-2:   #EFF2F6;
    --ink:         #16181F;
    --ink-2:       #4A5261;
    --ink-3:       #79808F;
    --rule:        #DDE2E9;
    --rule-strong: #C3CAD5;
    --accent:      #29457E;
    --accent-soft: #E6ECF7;
    --fix:         #0E7C66;
    --blocked:     #A2660A;
    --nolock:      #9B3535;
    --shade-a:     rgba(41, 69, 126, 0.10);
    --shade-b:     rgba(41, 69, 126, 0.24);

    --f-display: "IBM Plex Sans Condensed", "Helvetica Neue", Arial, sans-serif;
    --f-body:    "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --f-mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --measure: 66ch;
    --pad: clamp(1.25rem, 4vw, 3rem);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #101218;
      --surface:     #181B23;
      --surface-2:   #1F232D;
      --ink:         #E9EBF0;
      --ink-2:       #A9B1C0;
      --ink-3:       #78808F;
      --rule:        #2A2F3A;
      --rule-strong: #3B4250;
      --accent:      #8DAEE2;
      --accent-soft: #1B2432;
      --fix:         #43C2A2;
      --blocked:     #DFA23F;
      --nolock:      #E07777;
      --shade-a:     rgba(141, 174, 226, 0.12);
      --shade-b:     rgba(141, 174, 226, 0.28);
    }
  }

  :root[data-theme="dark"] {
    --ground:      #101218;
    --surface:     #181B23;
    --surface-2:   #1F232D;
    --ink:         #E9EBF0;
    --ink-2:       #A9B1C0;
    --ink-3:       #78808F;
    --rule:        #2A2F3A;
    --rule-strong: #3B4250;
    --accent:      #8DAEE2;
    --accent-soft: #1B2432;
    --fix:         #43C2A2;
    --blocked:     #DFA23F;
    --nolock:      #E07777;
    --shade-a:     rgba(141, 174, 226, 0.12);
    --shade-b:     rgba(141, 174, 226, 0.28);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1020px;
    margin: 0 auto;
    padding: 0 var(--pad) 6rem;
  }

  .prose { max-width: var(--measure); }

  p { margin: 0 0 1.1em; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px;
  }

  /* ---- masthead ---- */
  .masthead {
    border-bottom: 2px solid var(--ink);
    padding: clamp(2.5rem, 7vw, 4.5rem) 0 1.5rem;
    display: flex; flex-direction: column; gap: 1.4rem;
  }
  .kicker {
    font-family: var(--f-mono); font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
    display: flex; flex-wrap: wrap; gap: 0.5rem 1.4rem;
  }
  h1 {
    font-family: var(--f-display); font-weight: 700;
    font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1.02;
    letter-spacing: -0.015em; margin: 0; text-wrap: balance;
  }
  .standfirst {
    font-size: clamp(1.05rem, 2.2vw, 1.22rem); color: var(--ink-2);
    max-width: 56ch; margin: 0; font-style: italic;
  }
  .status {
    display: inline-flex; align-items: center; gap: 0.6rem; align-self: flex-start;
    font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--blocked);
    border: 1px solid currentColor; border-radius: 2px; padding: 0.35rem 0.7rem;
  }
  .status-live { color: var(--fix); }
  .status::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex: none;
  }

  /* ---- sections ---- */
  section { padding-top: clamp(3rem, 7vw, 4.5rem); }
  h2 {
    font-family: var(--f-display); font-weight: 600;
    font-size: clamp(1.5rem, 3.4vw, 2rem); line-height: 1.15;
    letter-spacing: -0.01em; margin: 0 0 1rem; text-wrap: balance;
    display: flex; align-items: baseline; gap: 0.85rem;
  }
  h2 .n {
    font-family: var(--f-mono); font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.1em; color: var(--accent); flex: none;
    padding-top: 0.15rem;
  }
  h3 {
    font-family: var(--f-display); font-weight: 600; font-size: 1.1rem;
    letter-spacing: 0.01em; margin: 2rem 0 0.6rem;
  }

  /* ---- figure ---- */
  figure { margin: 2rem 0 0; }
  .panels {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 3px; padding: 1.5rem;
  }
  .badge {
    font-family: var(--f-mono); font-size: 0.6rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--surface); background: var(--fix);
    border-radius: 2px; padding: 0.12rem 0.4rem; vertical-align: 0.15em;
    margin-left: 0.4rem; font-weight: 500;
  }
  .panel h4 {
    font-family: var(--f-display); font-size: 0.95rem; font-weight: 600;
    margin: 0 0 0.15rem;
  }
  .panel p {
    font-family: var(--f-mono); font-size: 0.72rem; line-height: 1.5;
    color: var(--ink-3); margin: 0 0 0.9rem;
  }
  .panel svg { width: 100%; height: auto; display: block; }
  .panel svg text { font-family: var(--f-mono); fill: var(--ink-3); }
  figcaption {
    font-size: 0.86rem; color: var(--ink-2); margin-top: 0.9rem;
    max-width: var(--measure);
  }
  .legend {
    display: flex; flex-wrap: wrap; gap: 0.4rem 1.3rem; margin-top: 1.1rem;
    font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-2);
    letter-spacing: 0.02em;
  }
  .legend span { display: inline-flex; align-items: center; gap: 0.45rem; }
  .swatch { display: inline-block; width: 15px; height: 3px; border-radius: 1px; flex: none; }

  /* ---- receiver comparison ---- */
  table.cmp td.part { font-family: var(--f-display); font-weight: 600; color: var(--ink);
                      white-space: nowrap; }
  table.cmp { min-width: 900px; }
  table.cmp tbody tr:hover { background: var(--rule); }


  /* ---- table footnotes ---- */
  .footnotes { margin: 0.9rem 0 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .footnotes .fn {
    display: flex; gap: 0.55rem; margin: 0;
    font-size: 0.78rem; line-height: 1.5; color: var(--ink-3);
  }
  .footnotes .mark {
    flex: 0 0 1rem; font-family: var(--f-mono); color: var(--ink-2);
  }

  /* ---- tables ---- */
  .scroll { overflow-x: auto; margin: 1.6rem 0 0; }
  table {
    border-collapse: collapse; width: 100%; min-width: 560px;
    font-family: var(--f-mono); font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
  }
  caption {
    text-align: left; font-family: var(--f-display); font-size: 0.95rem;
    font-weight: 600; color: var(--ink); padding-bottom: 0.6rem;
  }
  th, td {
    text-align: left; padding: 0.55rem 0.9rem 0.55rem 0;
    border-bottom: 1px solid var(--rule); vertical-align: top;
  }
  thead th {
    font-weight: 500; font-size: 0.68rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-3);
    border-bottom: 1px solid var(--rule-strong); white-space: nowrap;
  }
  td.num { text-align: right; padding-right: 1.4rem; }
  tbody tr:last-child td { border-bottom: none; }
  .id { color: var(--accent); font-weight: 500; white-space: nowrap; }
  .pending { color: var(--ink-3); }

  .tag {
    font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.1rem 0.4rem; border-radius: 2px; white-space: nowrap;
    border: 1px solid currentColor;
  }
  .t-fix { color: var(--fix); }
  .t-blocked { color: var(--blocked); }
  .t-nolock { color: var(--nolock); }
  .t-none { color: var(--ink-3); }

  /* ---- callout ---- */
  .callout {
    background: var(--surface); border: 1px solid var(--rule);
    border-left: 3px solid var(--blocked);
    border-radius: 0 3px 3px 0; padding: 1.3rem 1.5rem; margin: 2rem 0 0;
  }
  .callout h3 { margin-top: 0; color: var(--blocked); }
  .callout p:last-child { margin-bottom: 0; }
  .callout .prose { max-width: 62ch; }

  /* ---- code ---- */
  pre {
    background: var(--surface-2); border: 1px solid var(--rule); border-radius: 3px;
    padding: 1rem 1.1rem; overflow-x: auto; margin: 1.4rem 0 0;
    font-family: var(--f-mono); font-size: 0.76rem; line-height: 1.7;
    color: var(--ink-2);
  }
  code { font-family: var(--f-mono); font-size: 0.86em; color: var(--ink); }
  pre code { color: inherit; font-size: inherit; }

  /* ---- chain ---- */
  .chain {
    display: flex; flex-wrap: wrap; align-items: stretch; gap: 0.5rem;
    margin: 1.8rem 0 0; font-family: var(--f-mono); font-size: 0.72rem;
  }
  .node {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 3px;
    padding: 0.7rem 0.9rem; flex: 1 1 130px; min-width: 130px;
    display: flex; flex-direction: column; gap: 0.25rem;
  }
  .node b {
    font-family: var(--f-display); font-size: 0.85rem; font-weight: 600;
    color: var(--ink); letter-spacing: 0.01em;
  }
  .node span { color: var(--ink-3); line-height: 1.45; }
  .node.hot { border-color: var(--rule-strong); background: var(--accent-soft); }

  ul.notes {
    max-width: var(--measure); padding-left: 1.1rem; margin: 1.2rem 0 0;
  }
  ul.notes li { margin-bottom: 0.6rem; }
  ul.notes li::marker { color: var(--accent); }

  footer {
    margin-top: clamp(3.5rem, 8vw, 5rem); padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-3);
    display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem;
  }
  footer a { color: var(--ink-2); }
</style>
