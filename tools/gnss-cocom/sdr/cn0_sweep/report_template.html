<title>GNSS Receiver C/N0 Sweep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --ink: #1a2130; --muted: #5a6474; --rule: #d8dde5; --soft: #eceff3;
  --paper: #ffffff; --accent: #24407a; --gps: #1f6feb; --bds: #1a7f37; --gal: #c4561a;
  --good: #1a7f37; --bad: #b42318;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --cond: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1217; --surface: #151a21; --ink: #e4e8ee; --muted: #9aa3b0; --rule: #2a313b; --soft: #1b2129;
    --paper: #f3f4f6; --accent: #93b2ff; --gps: #5ca3ff; --bds: #45b85d; --gal: #ee8c48; --good: #45b85d; --bad: #ff7b72;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1217; --surface: #151a21; --ink: #e4e8ee; --muted: #9aa3b0; --rule: #2a313b; --soft: #1b2129;
  --paper: #f3f4f6; --accent: #93b2ff; --gps: #5ca3ff; --bds: #45b85d; --gal: #ee8c48; --good: #45b85d; --bad: #ff7b72;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); }
.wrap { max-width: 1140px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 72px; }
.eyebrow, .partno { font: 500 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 600 clamp(30px, 5vw, 44px)/1.1 var(--cond); margin: 8px 0 12px; letter-spacing: -.01em; text-wrap: balance; }
h2 { font: 600 30px/1.15 var(--cond); margin: 4px 0 14px; text-wrap: balance; }
h3 { font: 600 21px/1.25 var(--cond); margin: 40px 0 8px; text-wrap: balance; }
h4 { font: 600 16px/1.3 var(--cond); margin: 28px 0 6px; }
h2, h3, h4, .part { scroll-margin-top: 16px; }
p, li { max-width: 70ch; }
.lede { font-size: 17px; }
.partlede { font-size: 15.5px; }
a { color: var(--accent); }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; }
.toc a { display: inline-flex; align-items: baseline; gap: 8px; font: 500 13px/1 var(--mono); padding: 9px 13px;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); text-decoration: none; }
.toc a span { color: var(--muted); }
.toc a:hover, .toc a:focus-visible { border-color: var(--accent); }
.part { border-top: 2px solid var(--ink); margin-top: 64px; padding-top: 14px; }
.part:first-of-type { margin-top: 40px; }
.findings { display: grid; gap: 12px; padding: 0; list-style: none; margin: 18px 0 0; max-width: none; }
.findings li { max-width: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
  padding: 14px 16px; }
.findings b { font-weight: 600; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; margin: 14px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
thead th { font: 500 12px/1.3 var(--mono); color: var(--muted); letter-spacing: .03em; background: var(--soft); }
tbody th { font-weight: 600; white-space: nowrap; }
tr:last-child > * { border-bottom: 0; }
tr.group th { font: 500 12px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  background: var(--soft); padding-block: 6px; }
table.facts td { min-width: 16ch; }
table.facts th[scope=row] { width: 26%; white-space: normal; }
table.facts td, table.facts th[scope=col] { width: 37%; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.delta { color: var(--muted); }
.sub { display: block; font: 400 12px/1.3 var(--mono); color: var(--muted); margin-top: 3px; }
.sys { font-weight: 600; white-space: nowrap; }
.sys.G { color: var(--gps); } .sys.C { color: var(--bds); } .sys.E { color: var(--gal); }
td.chips { display: table-cell; }
.chip { display: inline-block; font: 12px/1.5 var(--mono); padding: 0 6px; border-radius: 4px; margin: 1px 2px;
  background: var(--soft); border-left: 3px solid var(--muted); white-space: nowrap; }
.chip.G { border-left-color: var(--gps); } .chip.C { border-left-color: var(--bds); } .chip.E { border-left-color: var(--gal); }
.chip.held { background: transparent; border: 1px solid var(--rule); border-left-width: 3px; }
.chip.held.G { border-left-color: var(--gps); } .chip.held.C { border-left-color: var(--bds); } .chip.held.E { border-left-color: var(--gal); }
.chip b { font-weight: 500; }
.chip.back { background: transparent; outline: 1px dashed var(--rule); outline-offset: -1px; }
.none { color: var(--muted); font-size: 12px; }
figure { margin: 16px 0; }
.chart { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; overflow-x: auto; }
.chart img { display: block; width: 100%; min-width: 760px; height: auto; }
figcaption { color: var(--muted); font-size: 13px; margin-top: 8px; max-width: 80ch; }
.key { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.key span::before { content: ""; display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px;
  background: currentColor; }
.key .kg { color: var(--gps); } .key .kc { color: var(--bds); } .key .ke { color: var(--gal); }
.runs { margin-top: 12px; }
.runs input { position: absolute; opacity: 0; pointer-events: none; }
.runs label { display: inline-block; font: 500 13px/1 var(--mono); padding: 9px 12px; margin: 0 6px 6px 0; cursor: pointer;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); }
.runs input:checked + label { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.runs input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.panes .runfig { display: none; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; }
.panes .runfig img { display: block; width: 100%; max-width: 980px; height: auto; margin: 0 auto; }
.panes .runfig figcaption { color: #5a6474; }
{{SHOW_RULES}}
.notes { padding-left: 20px; }
.notes li { margin: 6px 0; }
.notes b { font-weight: 600; }
footer { margin-top: 56px; border-top: 1px solid var(--rule); padding-top: 14px; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { .wrap { padding-inline: 16px; } h2 { font-size: 26px; } h3 { margin-top: 32px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }
</style>

<div class="wrap">
<header>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1>PX1105R, NEO-M8T, ZED-F9P and mosaic-G5 C/N0 Sweep</h1>
  <p class="lede">{{LEDE}}</p>
  <nav class="toc" aria-label="Contents">
{{TOC}}
  </nav>
</header>

{{PARTS}}

<footer>Bench data, TinkerRocket COCOM rig. The scripts and the report's text and data are in tools/gnss-cocom/sdr/cn0_sweep;
the captures, the IQ files and the roof logs stay on the bench machine.</footer>
</div>
