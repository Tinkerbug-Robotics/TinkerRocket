<svg viewBox="0 0 900 506" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The LC86G in Balloon mode as the transmitted level is stepped down from HackRF gain 0 and back up. Reported carrier-to-noise follows the level one for one. Carrier lock holds to about 35 dBHz and is gone by 28; the fix holds to about 28 dBHz, is intermittent from 26 to 21, and is lost at 13.">
