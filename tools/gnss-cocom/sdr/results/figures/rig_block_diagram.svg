<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Block diagram of the GNSS receiver test rig: ephemeris and trajectory into gps-sdr-sim, baseband to a HackRF through attenuators into the receiver, then capture, classification and comparison against the injected trajectory">
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 7 4 L 0 7 z" fill="var(--ink-3, #79808F)"/>
  </marker>
</defs>
<style>
  .bl{font-family:var(--f-display,sans-serif);font-size:12.5px;font-weight:600;fill:var(--ink,#1B2230)}
  .sb{font-family:var(--f-mono,monospace);font-size:9.5px;fill:var(--ink-3,#79808F)}
  .lb{font-family:var(--f-mono,monospace);font-size:9.5px;fill:var(--ink-3,#79808F)}
  .hd{font-family:var(--f-display,sans-serif);font-size:10px;font-weight:600;
      letter-spacing:.09em;text-transform:uppercase;fill:var(--ink-3,#79808F)}
  .ar{stroke:var(--ink-3,#79808F);stroke-width:1.3}
</style>
<text class="hd" x="36" y="16">Signal generation</text>
<text class="hd" x="36" y="204">Measurement</text>
<rect x="36" y="26" width="132" height="48" rx="5" fill="var(--surface-2, #EEF1F5)" stroke="var(--rule, #DDE2E9)" stroke-width="1"/>
<text class="bl" x="102" y="46" text-anchor="middle">Ephemeris</text>
<text class="sb" x="102" y="61" text-anchor="middle">BKG broadcast</text>
<rect x="36" y="88" width="132" height="48" rx="5" fill="var(--surface-2, #EEF1F5)" stroke="var(--rule, #DDE2E9)" stroke-width="1"/>
<text class="bl" x="102" y="108" text-anchor="middle">Trajectory</text>
<text class="sb" x="102" y="123" text-anchor="middle">10 Hz lat/lon/alt</text>
<rect x="198" y="57" width="104" height="48" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="250" y="77" text-anchor="middle">gps-sdr-sim</text>
<text class="sb" x="250" y="92" text-anchor="middle">GPS L1 C/A</text>
<rect x="332" y="57" width="109" height="48" rx="5" fill="var(--surface-2, #EEF1F5)" stroke="var(--rule, #DDE2E9)" stroke-width="1"/>
<text class="bl" x="386" y="77" text-anchor="middle">Baseband</text>
<text class="sb" x="386" y="92" text-anchor="middle">2.6 MSa/s .C8</text>
<rect x="471" y="57" width="97" height="48" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="519" y="77" text-anchor="middle">HackRF One</text>
<text class="sb" x="519" y="92" text-anchor="middle">1575.42 MHz</text>
<rect x="598" y="57" width="104" height="48" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="650" y="77" text-anchor="middle">Attenuators</text>
<text class="sb" x="650" y="92" text-anchor="middle">70 or 100 dB</text>
<rect x="36" y="214" width="97" height="48" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="84" y="234" text-anchor="middle">Receiver</text>
<text class="sb" x="84" y="249" text-anchor="middle">one of five</text>
<rect x="163" y="214" width="97" height="48" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="211" y="234" text-anchor="middle">Capture</text>
<text class="sb" x="211" y="249" text-anchor="middle">UART or USB</text>
<rect x="290" y="214" width="167" height="48" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="373" y="234" text-anchor="middle">Classifier</text>
<text class="sb" x="373" y="249" text-anchor="middle">FIX / BLOCKED / NO_LOCK</text>
<rect x="487" y="214" width="162" height="48" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="568" y="234" text-anchor="middle">Compare</text>
<text class="sb" x="568" y="249" text-anchor="middle">against the trajectory</text>
<rect x="679" y="214" width="156" height="48" rx="5" fill="var(--accent-soft, #E7EDF6)" stroke="var(--accent, #2C5CA8)" stroke-width="1"/>
<text class="bl" x="757" y="234" text-anchor="middle">Gate thresholds</text>
<text class="sb" x="757" y="249" text-anchor="middle">velocity and altitude</text>
<path class="ar" d="M 168 50 H 183 V 81 H 198" fill="none" marker-end="url(#ah)"/>
<path class="ar" d="M 168 112 H 183 V 81 H 198" fill="none" marker-end="url(#ah)"/>
<line class="ar" x1="302" y1="81" x2="332" y2="81" marker-end="url(#ah)"/>
<line class="ar" x1="441" y1="81" x2="471" y2="81" marker-end="url(#ah)"/>
<line class="ar" x1="568" y1="81" x2="598" y2="81" marker-end="url(#ah)"/>
<line class="ar" x1="133" y1="238" x2="163" y2="238" marker-end="url(#ah)"/>
<line class="ar" x1="260" y1="238" x2="290" y2="238" marker-end="url(#ah)"/>
<line class="ar" x1="457" y1="238" x2="487" y2="238" marker-end="url(#ah)"/>
<line class="ar" x1="649" y1="238" x2="679" y2="238" marker-end="url(#ah)"/>
<path class="ar" d="M 650 105 V 147 H 84 V 214" fill="none" marker-end="url(#ah)"/>
<text class="lb" x="367" y="140" text-anchor="middle">conducted (SMA), or radiated inside a Faraday cage</text>
<path class="ar" d="M 36 112 H 15 V 296 H 568 V 262" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text class="lb" x="291" y="310" text-anchor="middle">the same trajectory is the ground truth</text>
</svg>
