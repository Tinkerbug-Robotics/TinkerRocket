<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Block diagram of the GNSS receiver test rig: ephemeris and trajectory into gps-sdr-sim, baseband to a HackRF through attenuators into the receiver, then capture, classification and comparison against the injected trajectory">
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 7 4 L 0 7 z" fill="var(--ink-3, #79808F)"/>
  </marker>
</defs>
<style>
  .bl{font-family:var(--f-display,sans-serif);font-size:12.5px;font-weight:600;fill:var(--ink,#1B2230)}
  .sb{font-family:var(--f-mono,monospace);font-size:9.5px;fill:var(--ink-3,#79808F)}
  .lb{font-family:var(--f-mono,monospace);font-size:9.5px;fill:var(--ink-3,#79808F)}
  .hd{font-family:var(--f-display,sans-serif);font-size:10px;font-weight:600;
      letter-spacing:.09em;text-transform:uppercase;fill:var(--ink-3,#79808F)}
  .ar{stroke:var(--ink-3,#79808F);stroke-width:1.3}
</style>
<text class="hd" x="14" y="18">Signal generation</text>
<text class="hd" x="14" y="184">Measurement</text>
<rect x="14" y="30" width="128" height="46" rx="5" fill="var(--surface-2, #EEF1F5)" stroke="var(--rule, #DDE2E9)" stroke-width="1"/>
<text class="bl" x="78" y="49" text-anchor="middle">Broadcast ephemeris</text>
<text class="sb" x="78" y="64" text-anchor="middle">BKG, RINEX 3 → 2</text>
<rect x="14" y="92" width="128" height="46" rx="5" fill="var(--surface-2, #EEF1F5)" stroke="var(--rule, #DDE2E9)" stroke-width="1"/>
<text class="bl" x="78" y="111" text-anchor="middle">Trajectory</text>
<text class="sb" x="78" y="126" text-anchor="middle">10 Hz lat/lon/alt</text>
<rect x="176" y="61" width="118" height="46" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="235" y="80" text-anchor="middle">gps-sdr-sim</text>
<text class="sb" x="235" y="95" text-anchor="middle">GPS L1 C/A</text>
<rect x="328" y="61" width="104" height="46" rx="5" fill="var(--surface-2, #EEF1F5)" stroke="var(--rule, #DDE2E9)" stroke-width="1"/>
<text class="bl" x="380" y="80" text-anchor="middle">.C8 baseband</text>
<text class="sb" x="380" y="95" text-anchor="middle">2.6 MSa/s</text>
<rect x="466" y="61" width="118" height="46" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="525" y="80" text-anchor="middle">HackRF One</text>
<text class="sb" x="525" y="95" text-anchor="middle">1575.42 MHz</text>
<rect x="618" y="61" width="118" height="46" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="677" y="80" text-anchor="middle">Attenuators</text>
<text class="sb" x="677" y="95" text-anchor="middle">70 or 100 dB</text>
<rect x="466" y="196" width="118" height="46" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="525" y="215" text-anchor="middle">Receiver</text>
<text class="sb" x="525" y="230" text-anchor="middle">one of five</text>
<rect x="618" y="196" width="118" height="46" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="677" y="215" text-anchor="middle">Capture</text>
<text class="sb" x="677" y="230" text-anchor="middle">UART or USB</text>
<rect x="762" y="196" width="124" height="46" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="824" y="215" text-anchor="middle">Classifier</text>
<text class="sb" x="824" y="230" text-anchor="middle">FIX / BLOCKED / NO_LOCK</text>
<rect x="302" y="196" width="128" height="46" rx="5" fill="var(--surface, #FFFFFF)" stroke="var(--rule-strong, #C3CAD5)" stroke-width="1"/>
<text class="bl" x="366" y="215" text-anchor="middle">Compare</text>
<text class="sb" x="366" y="230" text-anchor="middle">vs injected truth</text>
<rect x="110" y="196" width="152" height="46" rx="5" fill="var(--accent-soft, #E7EDF6)" stroke="var(--accent, #2C5CA8)" stroke-width="1"/>
<text class="bl" x="186" y="215" text-anchor="middle">Gate thresholds</text>
<text class="sb" x="186" y="230" text-anchor="middle">velocity and altitude</text>
<path class="ar" d="M 142 53 V 68.5 H 176 V 84" fill="none" marker-end="url(#ah)"/>
<path class="ar" d="M 142 115 V 99.5 H 176 V 84" fill="none" marker-end="url(#ah)"/>
<line class="ar" x1="294" y1="84" x2="328" y2="84" marker-end="url(#ah)"/>
<line class="ar" x1="432" y1="84" x2="466" y2="84" marker-end="url(#ah)"/>
<line class="ar" x1="584" y1="84" x2="618" y2="84" marker-end="url(#ah)"/>
<path class="ar" d="M 736 84 H 772 V 150 H 525 V 196" fill="none" marker-end="url(#ah)"/>
<text class="lb" x="648" y="144" text-anchor="middle">conducted (SMA) &#183; or radiated into a Faraday cage</text>
<line class="ar" x1="584" y1="219" x2="618" y2="219" marker-end="url(#ah)"/>
<line class="ar" x1="736" y1="219" x2="762" y2="219" marker-end="url(#ah)"/>
<path class="ar" d="M 824 242 V 272 H 366 V 242" fill="none" marker-end="url(#ah)"/>
<text class="lb" x="595" y="288" text-anchor="middle">per-epoch fix state and satellite C/N&#8320;</text>
<line class="ar" x1="302" y1="219" x2="262" y2="219" marker-end="url(#ah)"/>
<path class="ar" d="M 78 138 V 219 H 110" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text class="lb" x="70" y="172" text-anchor="middle" transform="rotate(-90 70 172)">ground truth</text>
</svg>
