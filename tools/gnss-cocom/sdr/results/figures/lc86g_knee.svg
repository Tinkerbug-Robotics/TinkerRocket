<svg viewBox="0 0 900 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Each LC86G channel plotted at the Doppler rate its satellite presented through the burn. At 13.5 g every channel at or below 128 Hz per second held and every one at or above 171 held lost. At 2 g every channel held; the three steepest slipped carrier phase at ignition.">
