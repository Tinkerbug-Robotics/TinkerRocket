<text class="lbl" x="54.0" y="386.0">change in carrier-to-noise from the pad baseline to the burn, per satellite. Doppler measured from RXM-RAWX on a byte-identical scenario, so it is</text>
<text class="lbl" x="54.0" y="398.0">the same injected signal in all four runs. GPS:11 (the highest rate of any satellite) is absent from the left panel: its raw measurement dropped out through the burn.</text>
